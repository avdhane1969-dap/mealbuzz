<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meal Buzz Partner — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d2940;--muted:#667685;--paper:#f7f1e7;--coral:#ff654b;--green:#198668;--line:rgba(13,41,64,.10);--shadow:0 18px 50px rgba(13,41,64,.09)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#fffaf3,#f7f1e7 58%,#fff8e8);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}button,input,textarea{font:inherit}a{text-decoration:none;color:inherit}.shell{max-width:1100px;margin:auto;padding:0 24px 45px}.top{height:96px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#ff5b43,#ff8e64);color:#fff;box-shadow:7px 7px 0 rgba(239,173,56,.3);transform:rotate(-4deg)}.brand-name{font:700 26px "Space Grotesk";letter-spacing:-.05em}.brand-name span{color:var(--coral)}.back{padding:11px 15px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:900}.card{background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}h1{font:700 40px "Space Grotesk";letter-spacing:-.05em;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 15px;color:var(--ink);outline:0}.field textarea{min-height:100px;resize:vertical}.preview{margin-top:10px;padding:12px;border-radius:16px;background:#fff7ec;color:#756047;font-size:12px}.preview img{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-top:8px}.save{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--coral);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(255,101,75,.2)}.status{margin-top:10px;font-size:13px;color:var(--green);font-weight:800}.status.error{color:#c94d45}@media(max-width:640px){.shell{padding:0 14px 35px}.top{height:82px}.brand-name{font-size:22px}.card{padding:20px 16px;border-radius:24px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

/* 2026 owner-profile polish */
body:before{content:"";position:fixed;width:420px;height:420px;border-radius:50%;right:-170px;top:-190px;background:rgba(255,101,75,.06);pointer-events:none}
.card{position:relative;overflow:hidden;backdrop-filter:blur(12px)}.card:before{content:"PROFILE";position:absolute;right:24px;top:24px;font:800 11px "DM Sans";letter-spacing:.16em;color:rgba(13,41,64,.24)}
h1{font-size:44px}.sub{font-size:15px;line-height:1.6;max-width:620px}
.field{padding:2px}.field label{color:#385064;letter-spacing:.01em}
.field input,.field textarea,.field select{transition:border-color .2s,box-shadow .2s}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(25,134,104,.38)!important;box-shadow:0 0 0 4px rgba(25,134,104,.08)}
.preview{border:1px dashed rgba(13,41,64,.12);background:linear-gradient(135deg,#fff9f1,#f7fbf9)}
.preview img{box-shadow:0 10px 24px rgba(13,41,64,.10)}
.save{transition:.2s}.save:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(255,101,75,.24)}
.back{transition:.2s}.back:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(13,41,64,.06)}
@media(max-width:640px){
  .top{height:78px}.card:before{display:none}h1{font-size:34px}.sub{font-size:14px}
  .card{box-shadow:0 14px 34px rgba(13,41,64,.07)}
}
</style></head><body><main class="shell"><header class="top"><a class="brand" href="index.html"><span class="logo">🍽</span><span class="brand-name">Meal <span>Buzz</span></span></a><a class="back" href="dashboard.html">← Dashboard</a></header><section class="card"><h1>Edit kitchen profile</h1><p class="sub">Update owner details, kitchen name, pricing, location and main photo.</p><div class="grid"><div class="field"><label>Owner name</label><input id="ownerName"></div><div class="field"><label>Mobile number</label><input id="contact" inputmode="numeric"></div><div class="field"><label>Kitchen name</label><input id="messName"></div><div class="field"><label>Base price</label><input id="price"></div><div class="field"><label>Food type</label><select id="mealType" style="width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 15px;color:var(--ink)"><option value="veg">Veg</option><option value="nonveg">Non-Veg</option><option value="both">Both</option></select></div><div class="field full"><label>Address / area</label><textarea id="location"></textarea><button type="button" class="back" style="margin-top:10px" onclick="captureLocation()">◎ Update current location</button><div id="coordsNote" class="preview" style="display:none"></div></div><div class="field full"><label>Change main photo (optional)</label><input id="mainImage" type="file" accept="image/jpeg,image/png,image/webp"><div id="imagePreview" class="preview">Current image will appear here.</div></div><div class="field full"><button id="saveBtn" class="save" onclick="saveProfile()">Save changes →</button><div id="statusText" class="status"></div></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://iinvhwsbnvmcujyrzlxe.supabase.co","sb_publishable_fwhxfVqWpDrro8hkQbQQRA_1crMexZv");let currentMessId=null,currentLat=null,currentLon=null;
function setStatus(m,e=false){const x=document.getElementById("statusText");x.textContent=m;x.className=e?"status error":"status"}function showImage(url){imagePreview.innerHTML=url?'Current photo:<img src="'+url+'" alt="Kitchen">':"No image uploaded yet."}
async function getMess(){
  const legacyToken=localStorage.getItem("ownerLegacyToken");
  if(legacyToken){
    const{data}=await sb.rpc("legacy_get_mess",{p_token:legacyToken});
    if(Array.isArray(data)&&data[0])return data[0];
  }
  const{data:u}=await sb.auth.getUser();
  if(u?.user){
    const{data,error}=await sb.rpc("get_my_mess");
    if(!error&&Array.isArray(data)&&data[0])return data[0];
  }
  return null
}
async function load(){const d=await getMess();if(!d){setStatus("Could not load profile. Please login again.",true);return}currentMessId=d.id;ownerName.value=d.owner_name||"";contact.value=d.contact||"";messName.value=d.name||"";price.value=d.price||"";location.value=d.location||"";mealType.value=d.type||"veg";currentLat=d.latitude??null;currentLon=d.longitude??null;showImage(d.image_url||null)}
function captureLocation(){if(!navigator.geolocation){setStatus("Location is not supported on this device.",true);return}navigator.geolocation.getCurrentPosition(p=>{currentLat=p.coords.latitude;currentLon=p.coords.longitude;coordsNote.style.display="block";coordsNote.textContent="Location updated: "+currentLat.toFixed(5)+", "+currentLon.toFixed(5)},()=>setStatus("Please allow location permission.",true),{enableHighAccuracy:true,timeout:8000})}
async function upload(file){if(!file)return null;if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw new Error("Only JPG, PNG or WEBP images are allowed.");if(file.size>5*1024*1024)throw new Error("Image must be below 5 MB.");const name="mess-profile/"+Date.now()+"-"+file.name.toLowerCase().replace(/[^a-z0-9.]/g,"-");const{error}=await sb.storage.from("mess-images").upload(name,file);if(error)throw error;return sb.storage.from("mess-images").getPublicUrl(name).data.publicUrl}
async function saveProfile(){
  const phone=String(contact.value||"").replace(/\D/g,"").slice(-10);
  if(!ownerName.value.trim()||phone.length!==10||!messName.value.trim()||!price.value.trim()||!location.value.trim()){setStatus("Please fill all details and use a valid 10 digit mobile number.",true);return}
  if(!currentMessId){setStatus("Kitchen ID not found.",true);return}
  saveBtn.disabled=true;
  try{
    const legacyToken=localStorage.getItem("ownerLegacyToken");
    let image=null;
    if(mainImage.files[0]){
      if(legacyToken){
        setStatus("For security, photo changes require your account to be upgraded. Other profile details can still be saved.",true);
      }else{
        image=await upload(mainImage.files[0]);
      }
    }
    const payload={owner_name:ownerName.value.trim(),contact:phone,name:messName.value.trim(),price:price.value.trim(),location:location.value.trim(),type:mealType.value,updated_at:new Date().toISOString()};
    if(currentLat!==null&&currentLon!==null){payload.latitude=currentLat;payload.longitude=currentLon}
    if(image)payload.image_url=image;

    if(legacyToken){
      const{data,error}=await sb.rpc("legacy_update_profile",{
        p_token:legacyToken,p_owner_name:payload.owner_name,p_contact:payload.contact,p_name:payload.name,p_price:payload.price,
        p_location:payload.location,p_type:payload.type,p_lat:payload.latitude??null,p_lon:payload.longitude??null,p_image_url:image||""
      });
      if(error||!data)throw error||new Error("Legacy session expired. Please login again.");
    }else{
      const{error}=await sb.from("mess").update(payload).eq("id",Number(currentMessId));
      if(error)throw error;
    }

    localStorage.setItem("ownerMessName",payload.name);localStorage.setItem("ownerPhone",phone);
    if(image)showImage(image);
    setStatus("Profile updated successfully ✓");
  }catch(e){setStatus(e.message||"Save failed.",true)}finally{saveBtn.disabled=false}
}
load();
</script></body></html>
