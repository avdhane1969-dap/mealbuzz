<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meal Buzz - Mess Details</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="theme-color" content="#0b0d12" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#0b0d12;
      --bg2:#141925;
      --card:rgba(23,27,36,0.82);
      --card2:rgba(18,22,31,0.92);
      --line:rgba(255,255,255,0.10);
      --text:#f5f7fb;
      --muted:#b9c0cc;
      --accent:#ff8a00;
      --accent2:#ffb347;
      --green:#27c26c;
      --red:#ef4444;
      --yellow:#facc15;
      --shadow:0 16px 34px rgba(0,0,0,0.28);
    }

    body{
      font-family:Inter, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top right, rgba(255,138,0,0.12), transparent 24%),
        radial-gradient(circle at top left, rgba(255,255,255,0.04), transparent 18%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      min-height:100vh;
      padding-bottom:34px;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font-family:inherit;
    }

    img{
      display:block;
      max-width:100%;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:1000;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:15px 16px;
      background:rgba(11,13,18,0.88);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,0.07);
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .back{
      flex-shrink:0;
      min-width:44px;
      height:44px;
      padding:0 13px;
      border-radius:14px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.10);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:14px;
      font-weight:900;
    }

    .brand{
      min-width:0;
    }

    .brand h1{
      font-family:Poppins,sans-serif;
      font-size:27px;
      line-height:1;
      background:linear-gradient(90deg,#ffffff 0%,#ffdcb3 38%,#ffb347 65%,#ff8a00 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .brand p{
      margin-top:6px;
      color:#d6dde8;
      font-size:10px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      font-weight:800;
    }

    .container{
      max-width:920px;
      margin:0 auto;
      padding:16px;
      display:grid;
      gap:16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      overflow:hidden;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .hero-img{
      width:100%;
      height:270px;
      object-fit:cover;
      background:#111;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .content{
      padding:18px;
      display:grid;
      gap:16px;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .title{
      font-family:Poppins,sans-serif;
      font-size:30px;
      line-height:1.12;
      color:#fff;
    }

    .status{
      flex-shrink:0;
      font-size:11px;
      font-weight:900;
      padding:7px 10px;
      border-radius:999px;
      text-transform:uppercase;
    }

    .status.open{
      color:#9ff2bd;
      background:rgba(39,194,108,0.14);
      border:1px solid rgba(39,194,108,0.28);
    }

    .status.limited{
      color:#ffe39a;
      background:rgba(250,204,21,0.14);
      border:1px solid rgba(250,204,21,0.28);
    }

    .status.closed{
      color:#ffb4b4;
      background:rgba(239,68,68,0.14);
      border:1px solid rgba(239,68,68,0.28);
    }

    .sub-meta{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      display:grid;
      gap:4px;
    }

    .price-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .info-box{
      background:rgba(255,255,255,0.045);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:14px;
    }

    .info-label{
      color:#ffbe63;
      font-size:12px;
      font-weight:900;
      letter-spacing:.7px;
      text-transform:uppercase;
      margin-bottom:7px;
    }

    .info-text{
      color:#f5f7fb;
      font-size:15px;
      font-weight:800;
      line-height:1.5;
      word-break:break-word;
    }

    .menu-section{
      display:grid;
      gap:12px;
    }

    .menu-card{
      background:rgba(255,255,255,0.045);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px;
      padding:15px;
    }

    .menu-title{
      color:#ffbe63;
      font-size:13px;
      font-weight:900;
      letter-spacing:.8px;
      text-transform:uppercase;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      gap:7px;
    }

    .menu-text{
      color:#dfe6f2;
      font-size:15px;
      line-height:1.75;
      white-space:pre-wrap;
    }

    .address-card{
      background:rgba(255,255,255,0.045);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px;
      padding:15px;
    }

    .address{
      color:#dfe6f2;
      font-size:15px;
      line-height:1.8;
      white-space:pre-wrap;
    }

    .btn-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      padding:13px;
      text-align:center;
      border-radius:16px;
      font-size:15px;
      font-weight:900;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#111;
      box-shadow:0 14px 28px rgba(255,138,0,0.18);
    }

    .btn.secondary{
      background:rgba(255,255,255,0.06);
      color:#fff;
      border:1px solid rgba(255,255,255,0.10);
      box-shadow:none;
    }

    .btn.disabled{
      opacity:.55;
      pointer-events:none;
    }

    .loading-card,
    .error-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:20px;
      box-shadow:var(--shadow);
      color:var(--muted);
      text-align:center;
      line-height:1.8;
      font-size:14px;
    }

    .error-card h2{
      color:#fff;
      font-family:Poppins,sans-serif;
      font-size:24px;
      margin-bottom:8px;
    }

    .small-note{
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
      text-align:center;
      margin-top:2px;
    }

    @media(min-width:760px){
      .container{
        padding:24px 28px;
      }

      .hero-img{
        height:350px;
      }

      .menu-section{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:520px){
      .price-row{
        grid-template-columns:1fr;
      }

      .btn-grid{
        grid-template-columns:1fr;
      }

      .title{
        font-size:26px;
      }

      .hero-img{
        height:240px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back">←</a>

      <div class="brand">
        <h1>Meal Buzz</h1>
        <p>Mess Details</p>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading-card">Loading mess details...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://iinvhwsbnvmcujyrzlxe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fwhxfVqWpDrro8hkQbQQRA_1crMexZv";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const messId = params.get("id");

    const fallbackImages = [
      "thali.jpg",
      "thali2.jpg",
      "thali3.jpg",
      "veg1.jpg",
      "paneer.jpg"
    ];

    function safeText(value, fallback = "Not updated"){
      return value && String(value).trim() ? String(value).trim() : fallback;
    }

    function getStatusClass(status){
      const s = String(status || "Open").toLowerCase();

      if(s.includes("closed")) return "closed";
      if(s.includes("limited")) return "limited";
      return "open";
    }

    function formatDateTime(value){
      if(!value) return "Not updated";

      try{
        const date = new Date(value);

        if(isNaN(date.getTime())) return "Not updated";

        return date.toLocaleString("en-IN", {
          day:"2-digit",
          month:"short",
          year:"numeric",
          hour:"numeric",
          minute:"2-digit"
        });
      }catch(e){
        return "Not updated";
      }
    }

    function getImage(mess){
      return mess.image_url || fallbackImages[0];
    }

    function getDirectionsLink(mess){
      const lat = Number(mess.latitude);
      const lon = Number(mess.longitude);

      if(lat && lon){
        return `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      }

      const query = encodeURIComponent(`${mess.name || ""} ${mess.location || ""}`);
      return `https://www.google.com/maps/search/?api=1&query=${query}`;
    }

    function getCallLink(contact){
      const clean = String(contact || "").replace(/\D/g, "");

      if(!clean){
        return "#";
      }

      return `tel:${clean}`;
    }

    function showError(title, message){
      document.getElementById("app").innerHTML = `
        <div class="error-card">
          <h2>${title}</h2>
          <p>${message}</p>
          <br>
          <a href="index.html" class="btn">Back to Home</a>
        </div>
      `;
    }

    async function loadDetails(){
      if(!messId){
        showError("Mess not found", "Missing mess ID. Please open a mess from the home page.");
        return;
      }

      try{
        const { data: mess, error } = await sb
          .from("mess")
          .select("*")
          .eq("id", Number(messId))
          .maybeSingle();

        if(error){
          console.log("Load detail error:", error);
          showError("Could not load mess", "Please check Supabase permissions or try again.");
          return;
        }

        if(!mess){
          showError("Mess not found", "This mess listing is not available.");
          return;
        }

        renderDetails(mess);

      }catch(err){
        console.log("Unexpected detail error:", err);
        showError("Something went wrong", "Could not load this mess right now.");
      }
    }

    function renderDetails(mess){
      const statusText = safeText(mess.status, "Open");
      const statusClass = getStatusClass(statusText);
      const price = safeText(mess.today_price || mess.price, "Price not updated");
      const basePrice = safeText(mess.price, "Not added");
      const updated = formatDateTime(mess.updated_at);
      const image = getImage(mess);
      const callLink = getCallLink(mess.contact);
      const directionsLink = getDirectionsLink(mess);
      const hasContact = String(mess.contact || "").replace(/\D/g, "").length > 0;

      document.title = `${safeText(mess.name, "Mess")} - Meal Buzz`;

      document.getElementById("app").innerHTML = `
        <article class="card">
          <img
            src="${image}"
            class="hero-img"
            alt="${safeText(mess.name, "Mess image")}"
            onerror="this.src='thali.jpg'"
          >

          <div class="content">
            <div class="title-row">
              <h2 class="title">${safeText(mess.name, "Unnamed Mess")}</h2>
              <span class="status ${statusClass}">${statusText}</span>
            </div>

            <div class="sub-meta">
              <div>📍 ${safeText(mess.location, "Location not added")}</div>
              <div>🕒 Last updated: ${updated}</div>
            </div>

            <div class="price-row">
              <div class="info-box">
                <div class="info-label">Today Price</div>
                <div class="info-text">${price}</div>
              </div>

              <div class="info-box">
                <div class="info-label">Base / Monthly Price</div>
                <div class="info-text">${basePrice}</div>
              </div>
            </div>

            <section class="menu-section">
              <div class="menu-card">
                <div class="menu-title">☕ Morning</div>
                <div class="menu-text">${safeText(mess.morning_menu, "Morning menu not updated")}</div>
              </div>

              <div class="menu-card">
                <div class="menu-title">🍱 Lunch</div>
                <div class="menu-text">${safeText(mess.lunch_menu, "Lunch menu not updated")}</div>
              </div>

              <div class="menu-card">
                <div class="menu-title">🌙 Dinner</div>
                <div class="menu-text">${safeText(mess.dinner_menu, "Dinner menu not updated")}</div>
              </div>
            </section>

            <div class="address-card">
              <div class="info-label">Address</div>
              <div class="address">${safeText(mess.location, "Address not added")}</div>
            </div>

            <div class="btn-grid">
              <a href="${callLink}" class="btn ${hasContact ? "" : "disabled"}">
                📞 Call Owner
              </a>

              <a href="${directionsLink}" target="_blank" rel="noopener" class="btn secondary">
                📍 Get Directions
              </a>
            </div>

            <div class="small-note">
              Menu is updated directly by the mess owner on Meal Buzz Partner.
            </div>
          </div>
        </article>
      `;
    }

    loadDetails();
  </script>
</body>
</html>
