<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meal Buzz Partner — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d2940;--muted:#667685;--paper:#f7f1e7;--coral:#ff654b;--green:#198668;--line:rgba(13,41,64,.10);--shadow:0 18px 50px rgba(13,41,64,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#fffaf3,#f7f1e7 58%,#fff8e8);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}button,input,textarea,select{font:inherit}a{text-decoration:none;color:inherit}.shell{max-width:1320px;margin:auto;padding:0 24px 50px}
.top{height:96px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#ff5b43,#ff8e64);color:#fff;box-shadow:7px 7px 0 rgba(239,173,56,.3);transform:rotate(-4deg)}.brand-name{font:700 26px "Space Grotesk";letter-spacing:-.05em}.brand-name span{color:var(--coral)}.actions{display:flex;gap:10px}.btn{min-height:48px;padding:0 16px;border:0;border-radius:15px;font-weight:900;cursor:pointer}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0ed;color:#b8443a;border:1px solid rgba(184,68,58,.12)}.primary{background:var(--coral);color:#fff;box-shadow:0 12px 24px rgba(255,101,75,.2)}
.hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px}.side{padding:30px;border-radius:30px;background:linear-gradient(145deg,#0d2940,#173f55);color:#fff;box-shadow:var(--shadow)}.side .kicker{color:#9fd7c7;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.side h1{font:700 clamp(38px,4.6vw,62px)/1 "Space Grotesk";letter-spacing:-.06em;margin:14px 0}.side p{color:#d4e0e6;line-height:1.7}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.summary div{padding:14px;border-radius:17px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09)}.summary small{display:block;color:#bcd0da}.summary b{display:block;margin-top:4px;font-size:14px}
.panel{background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow)}.panel h2{font:700 32px "Space Grotesk";letter-spacing:-.04em;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:15px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 15px;outline:0;color:var(--ink)}textarea{min-height:100px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer}.save-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.status{font-size:13px;color:var(--green);font-weight:800}.status.error{color:#c94d45}.hidden{display:none!important}.loading{padding:28px;border-radius:24px;background:#fff;border:1px solid var(--line)}
@media(max-width:900px){.hero{grid-template-columns:1fr}}@media(max-width:640px){.shell{padding:0 14px 35px}.top{height:82px}.brand-name{font-size:22px}.actions .btn{padding:0 11px;font-size:11px}.side,.panel{padding:20px 16px;border-radius:24px}.summary,.two{grid-template-columns:1fr}.save-row{align-items:stretch;flex-direction:column}.save-row .btn{width:100%}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><a class="brand" href="index.html"><span class="logo">🍽</span><span class="brand-name">Meal <span>Buzz</span></span></a><div class="actions"><button class="btn ghost" onclick="openProfile()">Edit profile</button><button class="btn danger" onclick="logoutOwner()">Logout</button></div></header>
<div id="loading" class="loading">Loading your partner dashboard…</div>
<section id="app" class="hero hidden">
<aside class="side"><div class="kicker">Partner dashboard</div><h1 id="welcome">Welcome back.</h1><p>Keep today’s menu accurate so nearby customers always see what is actually available.</p><div class="summary"><div><small>Kitchen</small><b id="messName">—</b></div><div><small>Status</small><b id="statusBox">—</b></div><div><small>Base price</small><b id="priceBox">—</b></div><div><small>Area</small><b id="locationBox">—</b></div></div></aside>
<section class="panel"><h2>Update today’s menu</h2><p class="sub">Make a quick update for breakfast, lunch, dinner, status and price.</p><div class="grid">
<div class="field"><label>Morning menu</label><textarea id="morningMenu" placeholder="Poha, Upma, Tea…"></textarea><div class="chips"><button class="chip" onclick="addItem('morningMenu','Poha')">Poha</button><button class="chip" onclick="addItem('morningMenu','Upma')">Upma</button><button class="chip" onclick="addItem('morningMenu','Idli')">Idli</button></div></div>
<div class="field"><label>Lunch menu</label><textarea id="lunchMenu" placeholder="Chapati, Bhaji, Rice, Dal…"></textarea><div class="chips"><button class="chip" onclick="setFullMenu('lunchMenu','Chapati, Bhaji, Rice, Dal, Salad')">Basic thali</button><button class="chip" onclick="addItem('lunchMenu','Curd')">Curd</button><button class="chip" onclick="addItem('lunchMenu','Papad')">Papad</button></div></div>
<div class="field"><label>Dinner menu</label><textarea id="dinnerMenu" placeholder="Chapati, Bhaji, Rice, Dal…"></textarea><div class="chips"><button class="chip" onclick="setFullMenu('dinnerMenu','Chapati, Bhaji, Rice, Dal, Salad')">Basic thali</button><button class="chip" onclick="addItem('dinnerMenu','Curd')">Curd</button></div></div>
<div class="two"><div class="field"><label>Today status</label><select id="messStatus"><option>Open</option><option>Limited Meals</option><option>Closed</option></select></div><div class="field"><label>Today price</label><input id="todayPrice" placeholder="₹90 / ₹120 / monthly"></div></div>
</div><div class="save-row"><div id="saveStatus" class="status"></div><button id="saveBtn" class="btn primary" onclick="saveMenu()">Save today’s menu →</button></div></section>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://iinvhwsbnvmcujyrzlxe.supabase.co","sb_publishable_fwhxfVqWpDrro8hkQbQQRA_1crMexZv");let currentMessId=null;
function addItem(id,item){const f=document.getElementById(id),a=f.value.split(",").map(x=>x.trim().toLowerCase());if(!f.value.trim())f.value=item;else if(!a.includes(item.toLowerCase()))f.value+=", "+item}
function setFullMenu(id,text){document.getElementById(id).value=text}
function setStatus(m,e=false){const x=document.getElementById("saveStatus");x.textContent=m;x.className=e?"status error":"status"}
async function getMess(){const id=localStorage.getItem("ownerMessId");if(id){const{data}=await sb.from("mess").select("*").eq("id",Number(id)).maybeSingle();if(data)return data}const{data:u}=await sb.auth.getUser();if(u?.user){const{data}=await sb.from("mess").select("*").eq("user_id",u.user.id).maybeSingle();if(data)return data}return null}
async function init(){try{const d=await getMess();if(!d){document.getElementById("loading").innerHTML='No kitchen profile found. <a href="partner-login.html"><b>Login again</b></a>';return}currentMessId=d.id;localStorage.setItem("ownerMessId",d.id);document.getElementById("welcome").textContent="Welcome, "+(d.owner_name||d.name||"Partner");document.getElementById("messName").textContent=d.name||"—";document.getElementById("statusBox").textContent=d.status||"Open";document.getElementById("priceBox").textContent=d.price||"—";document.getElementById("locationBox").textContent=d.location||"—";document.getElementById("morningMenu").value=d.morning_menu||"";document.getElementById("lunchMenu").value=d.lunch_menu||d.today_menu||"";document.getElementById("dinnerMenu").value=d.dinner_menu||"";document.getElementById("messStatus").value=d.status||"Open";document.getElementById("todayPrice").value=d.today_price||d.price||"";document.getElementById("loading").classList.add("hidden");document.getElementById("app").classList.remove("hidden")}catch(e){document.getElementById("loading").textContent="Dashboard load failed."}}
async function saveMenu(){if(!currentMessId){setStatus("Kitchen not found.",true);return}document.getElementById("saveBtn").disabled=true;setStatus("Saving…");const payload={morning_menu:morningMenu.value.trim(),lunch_menu:lunchMenu.value.trim(),dinner_menu:dinnerMenu.value.trim(),status:messStatus.value,today_price:todayPrice.value.trim(),updated_at:new Date().toISOString()};const{error}=await sb.from("mess").update(payload).eq("id",Number(currentMessId));document.getElementById("saveBtn").disabled=false;if(error){setStatus("Save failed: "+error.message,true);return}document.getElementById("statusBox").textContent=payload.status;setStatus("Menu updated successfully ✓")}
function openProfile(){window.location.href="owner-profile.html"+(currentMessId?"?id="+encodeURIComponent(currentMessId):"")}
async function logoutOwner(){try{await sb.auth.signOut()}catch(e){}["ownerUserId","ownerMessId","ownerMessName","ownerPhone"].forEach(k=>localStorage.removeItem(k));window.location.href="partner-login.html"}
init();
</script></body></html>
